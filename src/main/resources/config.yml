# SmashEgg 4.0 — configurable via config.yml and lang/*.yml
# /smashegg reload applies config after full validation.
# Missing keys fall back to built-in defaults; old file is not overwritten.
# Empty sounds.messages."": disables the effect. Empty strings in config are valid.

settings:
  egg-break-on-spawner: true
  egg-break-chance: 30       # Integer 0..100: probability of break on spawner.
  ground-spawn-chance: 70    # Integer 0..100: chance to pass the check on other blocks.
  affect-creative: false    # true: Creative also loses egg on failure.

  # Blacklist: entity names (case-insensitive, normalized). Empty list = none.
  black-entities: []

# Sound defaults: volume, pitch, source (MASTER/MASTER/BLOCK/ENTITY) per sound key.
# These values are used if the key is present in sounds section but a sub-key is omitted.
defaults:
  sounds:
    volume: 1.0
    pitch: 1.0
    source: MASTER

# Particle defaults: count, spread, speed, offset-y.
# Override globally for all particle keys, or set per-key in particles section.
  particles:
    count: 10
    spread: 0.3
    speed: 0.0
    offset-y: 1.0

# Only for spawners. Ban does not consume egg and works even in Creative/bypass.
# Entity names are saved even on old servers; register new mobs even on old server.
black-entities:
  - ENDER_DRAGON
  - WITHER
  - WARDEN

# Sounds played. Empty string "" disables. Player only hears if they used the egg.
sounds:
  success: ENTITY_PLAYER_LEVELUP    # After confirmed type change in spawner.
  failure: ENTITY_VILLAGER_NO
  denied: BLOCK_ANVIL_LAND
  egg-break: BLOCK_GLASS_BREAK

# Messages use MiniMessage (HEX, gradients). Empty string "" disables message.
messages:
  usage: "<#E43A96>▶ <white>Usage: <#E43A96>/smashegg reload"
  reload-success: "<#E43A96>▶ <white>Configuration <#E43A96>successfully <white>reloaded!"
  reload-failure: "<#E43A96>▶ <red>Configuration error. <white>Previous settings preserved; details in console."
  no-permission: "<#E43A96>▶ <white>You <#E43A96>don't have permission <white>for this."
  egg-break: "<#E43A96>▶ <white>Your egg <#E43A96>broken <white>when placing in spawner!"
  ground-failure: "<#E43A96>▶ <white>Your egg <#E43A96>broken <white>in hand, mob didn't spawn!"
  denied: "<#E43A96>▶ <white>This mob type <#E43A96>is <white><blacklist> <white>in spawners!"

# Particles configuration per effect.
# offset-y is the vertical offset (height); offset-x and offset-z are optional.
particles:
  success:
    count: 10
    spread: 0.3
    speed: 0.0
    offset-y: 1.0
  failure:
    count: 10
    spread: 0.3
    speed: 0.0
    offset-y: 1.0
# SmashEgg 2.1 — сообщения используют MiniMessage, а не &-коды.
# /smashegg reload применяет конфиг только после полной проверки.
# При ошибке сохраняются предыдущие рабочие настройки; причина выводится в консоль.
# Отсутствующие ключи берутся из встроенных значений, старый файл не перезаписывается.
settings:
  egg-break-on-spawner: true
  egg-break-chance: 30       # Целое число 0..100: вероятность поломки на спавнере.
  ground-spawn-chance: 70    # Целое число 0..100: шанс пройти проверку на других блоках.
  affect-creative: false    # true: Creative тоже теряет яйцо при неудаче.

  # Только для спавнеров. Запрет не расходует яйцо и действует даже в Creative/bypass.
  # Регистр не важен. Названия новых мобов сохраняются даже на старом сервере.
  black-entities:
    - ENDER_DRAGON
    - WITHER
    - WARDEN

# Пустая строка "" отключает звук. Неверное имя отклоняет загрузку конфига.
# Звуки слышит только игрок, использовавший яйцо.
sounds:
  success: ENTITY_PLAYER_LEVELUP  # После подтверждённой смены типа моба в спавнере.
  failure: ENTITY_VILLAGER_NO
  denied: BLOCK_ANVIL_LAND
  egg-break: BLOCK_GLASS_BREAK

# Пустая строка "" отключает сообщение.
messages:
  usage: "<#E43A96>▶ <white>Использование: <#E43A96>/smashegg reload"
  reload-success: "<#E43A96>▶ <white>Конфигурация <#E43A96>успешно <white>перезагружена!"
  reload-failure: "<#E43A96>▶ <red>Ошибка конфигурации. <white>Прежние настройки сохранены; подробности в консоли."
  no-permission: "<#E43A96>▶ <white>У вас <#E43A96>нет прав <white>для этого."
  egg-break: "<#E43A96>▶ <white>Яйцо <#E43A96>разбилось <white>при установке в спавнер!"
  ground-failure: "<#E43A96>▶ <white>Яйцо <#E43A96>разбилось в руках<white>, моб не появился!"
  denied: "<#E43A96>▶ <white>Этот тип моба <#E43A96>запрещён <white>в спавнерах!"
